# プレフィックス入力時にIMEを半角に切り替え
set -g prefix C-F12
bind -n C-Space {
    run-shell -b '$HOME/.local/bin/zenhan.exe 0 >/dev/null 2>&1; true'
    switch-client -T prefix
}

# 新しいペインを現在のディレクトリで開く
bind '"' split-window -v -c '#{pane_current_path}'
bind '%' split-window -h -c '#{pane_current_path}'

# copy mode（vim風キーバインド + クリップボード連携）
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel '/mnt/c/WINDOWS/system32/clip.exe'

# 基本設定
set -g mode-keys vi
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

# ---- ここから tmux-agent-sidebar 関連 ----
# やめる時はこのブロックと .config/tmux/*.sh を外す。ほかの箇所は grep tmux-agent-sidebar で辿れる

# ステータス行は出さない（エージェントのあるウィンドウはサイドバーで、シェルだけのウィンドウは prefix+w で見る）
set -g status off

# tmux-agent-sidebar 本体（Claude Code の状態をサイドバーに表示。prefix+e で切替）
run-shell ~/.tmux/plugins/tmux-agent-sidebar/tmux-agent-sidebar.tmux

# セッションの最初のウィンドウにもサイドバーを出す（プラグインの自動生成は new-window のときだけ）
# toggle --create-only は、すでにサイドバーがあるウィンドウでは何もしない
set-hook -g after-new-session 'run-shell "\"#{@agent_sidebar_bin}\" toggle --create-only \"#{window_id}\" \"#{pane_current_path}\""'

# 以下の hook は番号を固定して登録し、tmux source を繰り返しても重複させない
# （プラグインは -a で先頭から詰めて登録するので、9 は衝突しない）
# 新しいウィンドウを作ったら、サイドバーの見出し順（リポジトリ名順）にウィンドウを並べ替える
# sort-windows.sh は Claude Code の SessionStart hook（.claude-linux/settings.json）からも呼ぶ
# セッション ID は $0 のような形で、run-shell がシェルに渡すと展開されてしまうので単一引用符で囲む
set-hook -g 'after-new-window[9]' "run-shell \"~/.config/tmux/sort-windows.sh '#{session_id}'\""
# ウィンドウを移ったら、サイドバーではなくエージェント側のペインにフォーカスを置く
set-hook -g 'after-select-window[9]' 'run-shell "~/.config/tmux/focus-agent-pane.sh #{window_id}"'
