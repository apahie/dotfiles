name: apahie-global-skills
version: 1.0.0
description: apahie's global Claude Code skills (managed by dotfiles)

# APM の標準構成に合わせ、manifest はリポジトリ root に置く。
# これによりこのリポジトリ自体を APM のローカルパッケージとして参照でき、
# 参照側は下記 dependencies を推移的に解決できる。

dependencies:
  apm:
    # Playwright CLI スキル（Web 操作自動化）
    - microsoft/playwright-cli/skills/playwright-cli
    # Anthropic 公式 skill 群（ドキュメント処理・デザイン・skill 作成など）
    - anthropics/skills
    # last30days スキル（Reddit/X/YouTube/HN 等の横断調査）
    - mvanhorn/last30days-skill/skills/last30days
    # 自分で育てるスキル（ソースは当リポジトリの skills/ 配下）。
    # ~/.apm/skills-private は setup.sh が張る skills/ への symlink で、
    # リポジトリの配置場所（単体 / submodule）にパスを依存させないための間接参照。
    - ~/.apm/skills-private/report
    - ~/.apm/skills-private/issue-readiness
    - ~/.apm/skills-private/japanese-tech-writing
    - ~/.apm/skills-private/cognitive-rhythm-writing
    - ~/.apm/skills-private/create-issue
    - ~/.apm/skills-private/polish-issue

# japanese-tech-writing と cognitive-rhythm-writing の由来は k16shikano 氏の gist。
# 上流の差分を確認するときは次を参照する。
#   japanese-tech-writing: https://gist.github.com/k16shikano/fd287c3133457c4fd8f5601d34aa817d
#   cognitive-rhythm-writing: https://gist.github.com/k16shikano/eb2929f13ed19c97188393d297be8432
