# プレフィックス入力時にIMEを半角に切り替え
set -g prefix C-F12
bind -n C-Space {
    run-shell -b '$HOME/.local/bin/zenhan.exe 0 >/dev/null 2>&1; true'
    switch-client -T prefix
}

# 新しいペインを現在のディレクトリで開く
bind '"' split-window -v -c '#{pane_current_path}'
bind '%' split-window -h -c '#{pane_current_path}'

# copy mode（vim風キーバインド + クリップボード連携）
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel '/mnt/c/WINDOWS/system32/clip.exe'

# 基本設定
set -g mode-keys vi
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

# ステータス行は出さない（ウィンドウ一覧はサイドバーと prefix+w で見る）
set -g status off

# tmux-agent-sidebar（Claude Code の状態をサイドバーに表示。prefix+e で切替）
run-shell ~/.tmux/plugins/tmux-agent-sidebar/tmux-agent-sidebar.tmux

# 新しいウィンドウを作ったら、サイドバーの見出し順（リポジトリ名順）にウィンドウを並べ替える。
# インデックスを固定して登録し、tmux source を繰り返しても重複させない（[0] はプラグインの hook）
set-hook -g 'after-new-window[9]' 'run-shell ~/.config/tmux/sort-windows.sh'
